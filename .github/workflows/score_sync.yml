name: FIFA 2026 Score Sync

on:
  schedule:
    # Runs every 5 minutes during the tournament for near-live score updates.
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: score-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run score sync
        env:
          SYNC_ENDPOINT: ${{ secrets.SYNC_ENDPOINT }}
          SCORE_SYNC_SECRET: ${{ secrets.SCORE_SYNC_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scraper.js